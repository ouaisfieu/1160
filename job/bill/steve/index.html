<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de Decks</title>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #171717;
            --bg-hover: #262626;
            --text-main: #ededed;
            --text-muted: #a1a1a1;
            --accent: #3b82f6; /* Bleu pro */
            --accent-hover: #2563eb;
            --border: #333;
            --radius: 12px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font);
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 5px; }

        /* --- GRID LAYOUT --- */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* --- CARD DESIGN --- */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 220px;
        }

        .card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
            background-color: var(--bg-hover);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #fff;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: auto; /* Pushes button to bottom */
        }

        .btn {
            display: inline-block;
            background-color: var(--text-main); /* White button on dark */
            color: #000;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            margin-top: 10px;
        }
        .btn-secondary:hover { background: var(--border); }

        /* --- MODAL PREVIEW --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--bg-card);
            width: 90%; max-width: 600px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center;}
        .preview-content {
            background: #000;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        /* --- UTILS --- */
        .loader { text-align: center; grid-column: 1/-1; padding: 50px; color: var(--text-muted); }
        .badge { 
            display: inline-block; padding: 4px 8px; border-radius: 4px; 
            background: rgba(59, 130, 246, 0.1); color: var(--accent); 
            font-size: 0.75rem; font-weight: 600;
        }

    </style>
</head>
<body>

    <header>
        <div>
            <h1>Bibliothèque de Données</h1>
            <div class="subtitle">Modules d'apprentissage pour Arizona OS</div>
        </div>
        <div>
            <a href="#" style="color: var(--text-main); text-decoration: none; font-size: 0.9rem;">Documentation ↗</a>
        </div>
    </header>

    <main id="catalog">
        <div class="loader">Chargement du catalogue...</div>
    </main>

    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title" style="margin:0; font-size:1.4rem;">Aperçu</h2>
                <button onclick="forceClose()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div id="modal-content" class="preview-content">
                Chargement...
            </div>
            <div style="display: flex; gap: 10px;">
                <a id="modal-download" href="#" target="_blank" class="btn">Télécharger le fichier (.csv)</a>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const REPO_OWNER = 'ouaisfieu';
        const REPO_NAME = '1160';
        const REPO_PATH = 'job/job/job/store'; // Chemin dans le repo

        // --- APP LOGIC ---
        const catalogEl = document.getElementById('catalog');
        const modalEl = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalDownload = document.getElementById('modal-download');

        async function fetchCatalog() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_PATH}`);
                if (!response.ok) throw new Error("Impossible de joindre le dépôt GitHub.");
                
                const data = await response.json();
                const csvFiles = data.filter(file => file.name.endsWith('.csv'));

                renderCatalog(csvFiles);

            } catch (err) {
                catalogEl.innerHTML = `
                    <div style="text-align:center; grid-column:1/-1; padding:40px;">
                        <h3 style="color:#ef4444">Erreur de connexion</h3>
                        <p style="color:var(--text-muted)">${err.message}</p>
                    </div>
                `;
            }
        }

        function renderCatalog(files) {
            catalogEl.innerHTML = '';
            
            if (files.length === 0) {
                catalogEl.innerHTML = '<div class="loader">Aucun deck disponible pour le moment.</div>';
                return;
            }

            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Card HTML
                card.innerHTML = `
                    <div>
                        <div class="card-icon">📄</div>
                        <h3 class="card-title">${formatName(file.name)}</h3>
                        <div class="card-meta">
                            <span class="badge">CSV</span> • ${(file.size / 1024).toFixed(1)} KB
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-secondary" onclick="openPreview('${file.download_url}', '${file.name}')">Aperçu</button>
                        <a href="${file.download_url}" class="btn" style="margin-top:10px" download>Télécharger</a>
                    </div>
                `;
                catalogEl.appendChild(card);
            });
        }

        async function openPreview(url, name) {
            modalTitle.innerText = formatName(name);
            modalContent.innerText = "Chargement des données...";
            modalDownload.href = url;
            modalEl.classList.add('active');

            try {
                const res = await fetch(url);
                const text = await res.text();
                // Take first 500 chars for preview
                const preview = text.length > 500 ? text.substring(0, 500) + "\n... (suite dans le fichier)" : text;
                modalContent.innerText = preview;
            } catch (e) {
                modalContent.innerText = "Impossible de charger l'aperçu.";
            }
        }

        function closeModal(e) {
            if (e.target === modalEl) modalEl.classList.remove('active');
        }

        function forceClose() {
            modalEl.classList.remove('active');
        }

        function formatName(filename) {
            return filename.replace('.csv', '').replace(/_/g, ' ').replace(/-/g, ' ').toUpperCase();
        }

        // Init
        fetchCatalog();

    </script>
</body>
</html>
