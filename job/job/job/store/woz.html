<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Catalogue</title>
    <meta name="description" content="Bibliothèque de decks de flashcards pour réviser efficacement.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --bg-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #2e2e2e;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: #404040;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 12px;
        }

        .btn-ghost:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: var(--radius-sm);
        }

        /* Hero Section */
        .hero {
            padding: 60px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 32px;
        }

        /* Search */
        .search-container {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 32px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Main Content */
        main {
            padding: 48px 0 80px;
        }

        /* Section Header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .filter-count {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .filter-btn:not(.active) .filter-count {
            background: var(--bg-tertiary);
        }

        /* Decks Grid */
        .decks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Deck Card */
        .deck-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .deck-card:hover {
            border-color: #404040;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .deck-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .deck-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .deck-badge {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .deck-badge.new {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .deck-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .deck-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .deck-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .deck-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .deck-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .deck-tag {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .deck-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .deck-actions .btn {
            flex: 1;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Preview Cards */
        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-card {
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 16px;
        }

        .preview-card-q {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .preview-card-a {
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding-left: 12px;
            border-left: 2px solid var(--accent);
        }

        .preview-more {
            text-align: center;
            padding: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-text {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            color: var(--success);
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 32px 0;
            text-align: center;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero h1 {
                font-size: 1.75rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .stats-bar {
                gap: 32px;
            }

            .decks-grid {
                grid-template-columns: 1fr;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filters {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 8px;
                flex-wrap: nowrap;
            }

            .filter-btn {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .deck-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">
                    <div class="logo-icon">📚</div>
                    <span>Flashcards</span>
                </a>
                <div class="header-actions">
                    <a href="https://github.com/ouaisfieu/1160" target="_blank" class="btn btn-ghost">
                        GitHub
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>Catalogue de Flashcards</h1>
            <p>Parcourez et téléchargez des decks prêts à l'emploi pour réviser efficacement.</p>
            
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="search-input" id="search-input" placeholder="Rechercher un deck...">
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="total-decks">—</div>
                    <div class="stat-label">Decks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-cards">—</div>
                    <div class="stat-label">Cartes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-categories">—</div>
                    <div class="stat-label">Catégories</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main -->
    <main>
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Tous les decks</h2>
                <div class="filters" id="filters"></div>
            </div>

            <div id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Chargement des decks...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="footer-text">
                Open source · 
                <a href="https://github.com/ouaisfieu/1160" class="footer-link" target="_blank">Contribuer sur GitHub</a>
            </p>
        </div>
    </footer>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modal-icon">📚</span>
                    <span id="modal-title">Aperçu</span>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="preview-list" id="preview-list"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Fermer</button>
                <button class="btn btn-primary" id="modal-download">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7,10 12,15 17,10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Télécharger
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span id="toast-message">Téléchargement lancé</span>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            owner: 'ouaisfieu',
            repo: '1160',
            branch: 'main',
            path: 'job/job/job/store'
        };

        // State
        let decks = [];
        let filtered = [];
        let currentFilter = 'all';

        // Icons par catégorie
        const ICONS = {
            'Économie': '💰',
            'Politique': '🏛️',
            'Belgique': '🇧🇪',
            'Social': '👥',
            'Fiscal': '📊',
            'Tech': '💻',
            'Science': '🔬',
            'Histoire': '📜',
            'Langues': '🌍',
            'default': '📚'
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadDecks();
            setupSearch();
        });

        // Load decks from GitHub
        async function loadDecks() {
            try {
                const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
                const response = await fetch(url);
                
                if (!response.ok) throw new Error('Repository non accessible');
                
                const files = await response.json();
                const csvFiles = files.filter(f => f.name.endsWith('.csv'));
                
                if (csvFiles.length === 0) {
                    showEmpty();
                    return;
                }

                decks = await Promise.all(csvFiles.map(async (file, i) => {
                    const rawUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.path}/${file.name}`;
                    
                    try {
                        const res = await fetch(rawUrl);
                        const text = await res.text();
                        const cards = parseCSV(text);
                        const tags = extractTags(cards);
                        const mainTag = tags[0] || 'Autre';
                        
                        return {
                            id: i,
                            filename: file.name,
                            title: formatTitle(file.name),
                            description: generateDescription(cards, tags),
                            icon: ICONS[mainTag] || ICONS.default,
                            tags: tags,
                            cardCount: cards.length,
                            cards: cards,
                            url: rawUrl,
                            isNew: false
                        };
                    } catch (e) {
                        return null;
                    }
                }));

                decks = decks.filter(Boolean);
                filtered = [...decks];
                
                updateStats();
                renderFilters();
                renderDecks();
                
            } catch (error) {
                showError(error.message);
            }
        }

        // Parse CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            return lines.map((line, i) => {
                let q, a;
                if (line.startsWith('"')) {
                    const match = line.match(/^"([^"]*(?:""[^"]*)*)"\s*,\s*(.*)$/);
                    if (match) {
                        q = match[1].replace(/""/g, '"');
                        a = match[2].replace(/^"|"$/g, '');
                    }
                } else {
                    const idx = line.indexOf(',');
                    if (idx > -1) {
                        q = line.substring(0, idx);
                        a = line.substring(idx + 1);
                    }
                }
                return q && a ? { id: i + 1, question: q.trim(), answer: a.trim() } : null;
            }).filter(Boolean);
        }

        // Extract tags
        function extractTags(cards) {
            const text = cards.slice(0, 15).map(c => c.question + ' ' + c.answer).join(' ').toLowerCase();
            const keywords = {
                'ecp': 'Économie', 'économi': 'Économie', 'contributive': 'Économie', 'budget': 'Économie',
                'gouvernement': 'Politique', 'arizona': 'Politique', 'coalition': 'Politique', 'ministre': 'Politique',
                'belge': 'Belgique', 'belgique': 'Belgique', 'bruxelles': 'Belgique',
                'social': 'Social', 'allocation': 'Social', 'chômage': 'Social', 'emploi': 'Social',
                'fiscal': 'Fiscal', 'taxe': 'Fiscal', 'impôt': 'Fiscal', 'tva': 'Fiscal',
                'solid': 'Tech', 'nyxo': 'Tech', 'protocole': 'Tech', 'numérique': 'Tech'
            };
            
            const found = new Set();
            for (const [kw, tag] of Object.entries(keywords)) {
                if (text.includes(kw)) found.add(tag);
            }
            return found.size > 0 ? Array.from(found) : ['Autre'];
        }

        // Format title
        function formatTitle(filename) {
            return filename
                .replace('.csv', '')
                .replace(/[-_]/g, ' ')
                .replace(/\s*\(\d+\)\s*/g, '')
                .replace(/\b\w/g, c => c.toUpperCase())
                .trim();
        }

        // Generate description
        function generateDescription(cards, tags) {
            const tagText = tags.length > 0 ? tags.slice(0, 2).join(', ') : 'divers sujets';
            return `${cards.length} questions sur ${tagText.toLowerCase()}. Idéal pour réviser et tester vos connaissances.`;
        }

        // Update stats
        function updateStats() {
            document.getElementById('total-decks').textContent = decks.length;
            document.getElementById('total-cards').textContent = decks.reduce((s, d) => s + d.cardCount, 0);
            const allTags = new Set();
            decks.forEach(d => d.tags.forEach(t => allTags.add(t)));
            document.getElementById('total-categories').textContent = allTags.size;
        }

        // Render filters
        function renderFilters() {
            const container = document.getElementById('filters');
            const allTags = {};
            decks.forEach(d => d.tags.forEach(t => allTags[t] = (allTags[t] || 0) + 1));
            
            container.innerHTML = `
                <button class="filter-btn active" data-filter="all" onclick="filter('all')">
                    Tous <span class="filter-count">${decks.length}</span>
                </button>
                ${Object.entries(allTags).map(([tag, count]) => `
                    <button class="filter-btn" data-filter="${tag}" onclick="filter('${tag}')">
                        ${tag} <span class="filter-count">${count}</span>
                    </button>
                `).join('')}
            `;
        }

        // Filter
        function filter(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === tag);
            });
            filtered = tag === 'all' ? [...decks] : decks.filter(d => d.tags.includes(tag));
            renderDecks();
        }

        // Render decks
        function renderDecks() {
            const container = document.getElementById('content');
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3 class="empty-title">Aucun résultat</h3>
                        <p class="empty-text">Aucun deck ne correspond à votre recherche.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="decks-grid">
                    ${filtered.map(deck => `
                        <div class="deck-card" onclick="preview(${deck.id})">
                            <div class="deck-header">
                                <div class="deck-icon">${deck.icon}</div>
                                ${deck.isNew ? '<span class="deck-badge new">Nouveau</span>' : ''}
                            </div>
                            <h3 class="deck-title">${deck.title}</h3>
                            <p class="deck-description">${deck.description}</p>
                            <div class="deck-tags">
                                ${deck.tags.map(t => `<span class="deck-tag">${t}</span>`).join('')}
                            </div>
                            <div class="deck-meta">
                                <span class="deck-meta-item">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="9" y1="3" x2="9" y2="21"></line>
                                    </svg>
                                    ${deck.cardCount} cartes
                                </span>
                            </div>
                            <div class="deck-actions" onclick="event.stopPropagation()">
                                <button class="btn btn-secondary" onclick="preview(${deck.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    Aperçu
                                </button>
                                <button class="btn btn-primary" onclick="download(${deck.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7,10 12,15 17,10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                    Télécharger
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Search
        function setupSearch() {
            const input = document.getElementById('search-input');
            let timeout;
            input.addEventListener('input', e => {
                clearTimeout(timeout);
                timeout = setTimeout(() => search(e.target.value), 200);
            });
        }

        function search(query) {
            query = query.toLowerCase().trim();
            if (!query) {
                filtered = currentFilter === 'all' ? [...decks] : decks.filter(d => d.tags.includes(currentFilter));
            } else {
                filtered = decks.filter(d => {
                    const text = `${d.title} ${d.description} ${d.tags.join(' ')}`.toLowerCase();
                    return text.includes(query);
                });
            }
            renderDecks();
        }

        // Preview modal
        function preview(id) {
            const deck = decks.find(d => d.id === id);
            if (!deck) return;
            
            document.getElementById('modal-icon').textContent = deck.icon;
            document.getElementById('modal-title').textContent = deck.title;
            document.getElementById('preview-list').innerHTML = 
                deck.cards.slice(0, 8).map(c => `
                    <div class="preview-card">
                        <div class="preview-card-q">${c.question}</div>
                        <div class="preview-card-a">${c.answer}</div>
                    </div>
                `).join('') +
                (deck.cardCount > 8 ? `<div class="preview-more">+ ${deck.cardCount - 8} autres cartes</div>` : '');
            
            document.getElementById('modal-download').onclick = () => { download(id); closeModal(); };
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', e => {
            if (e.target.id === 'modal') closeModal();
        });

        // Close on Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        // Download
        function download(id) {
            const deck = decks.find(d => d.id === id);
            if (!deck) return;
            
            const a = document.createElement('a');
            a.href = deck.url;
            a.download = deck.filename;
            a.click();
            
            showToast(`Téléchargement de "${deck.title}"`);
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Empty state
        function showEmpty() {
            document.getElementById('content').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <h3 class="empty-title">Aucun deck disponible</h3>
                    <p class="empty-text">Le catalogue est vide pour le moment. Revenez bientôt !</p>
                </div>
            `;
        }

        // Error state
        function showError(msg) {
            document.getElementById('content').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <h3 class="empty-title">Erreur de chargement</h3>
                    <p class="empty-text">${msg}</p>
                    <button class="btn btn-primary" onclick="loadDecks()" style="margin-top: 20px;">Réessayer</button>
                </div>
            `;
        }
    </script>
</body>
</html>
