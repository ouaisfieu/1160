<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // DATA UPLINK</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050510;
            --glass: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(0, 243, 255, 0.2);
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            font-family: 'Segoe UI', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- BACKGROUND FX --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1;
        }
        
        /* Scanlines */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 1000; pointer-events: none;
        }

        /* --- LAYOUT --- */
        header {
            padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-blue);
            background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,20,40,0.8) 100%);
            z-index: 10;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 10px var(--neon-blue); }

        #main-interface {
            display: flex; flex: 1; overflow: hidden; position: relative;
        }

        /* --- LEFT: DECK GRID --- */
        #deck-grid {
            flex: 2;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            overflow-y: auto;
            perspective: 1000px; /* 3D effect context */
        }

        .deck-card {
            background: var(--glass);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 15px;
            height: 150px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; justify-content: space-between;
            backdrop-filter: blur(5px);
            transform-style: preserve-3d;
        }

        .deck-card:hover {
            transform: translateY(-10px) rotateX(10deg) scale(1.05);
            border-color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            background: rgba(0, 243, 255, 0.1);
        }

        .deck-card::before {
            content: "CSV MODULE"; position: absolute; top: 5px; right: 5px;
            font-size: 0.6rem; color: var(--neon-purple); border: 1px solid var(--neon-purple);
            padding: 2px 4px;
        }

        .deck-icon { font-size: 2rem; margin-bottom: 10px; color: var(--neon-blue); }
        .deck-title { font-weight: bold; font-size: 1.1rem; word-break: break-all; }
        .deck-meta { font-size: 0.7rem; color: #aaa; margin-top: 5px; }

        /* --- RIGHT: PREVIEW PANEL --- */
        #preview-panel {
            flex: 1;
            width: 400px;
            background: rgba(0, 10, 20, 0.9);
            border-left: 1px solid var(--neon-blue);
            padding: 20px;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            display: flex; flex-direction: column;
            box-shadow: -10px 0 50px rgba(0,0,0,0.8);
            z-index: 20;
        }

        #preview-panel.active { transform: translateX(0); }

        .preview-header { 
            border-bottom: 1px dashed var(--neon-blue); padding-bottom: 10px; margin-bottom: 20px;
            font-size: 1.2rem; color: var(--neon-purple); text-shadow: 0 0 5px var(--neon-purple);
        }

        #code-block {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #0f0;
            background: #000;
            padding: 10px;
            overflow: auto;
            border: 1px solid #333;
            margin-bottom: 20px;
            white-space: pre;
        }

        .btn-action {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 15px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px; height: 36px; border-radius: 50%;
            border-left-color: var(--neon-blue);
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <div>
            <h1>/// 1160_STORE // UPLINK</h1>
            <div style="font-size: 0.8rem; opacity: 0.7;">GITHUB_REPO :: OUAISFIEU/1160</div>
        </div>
        <div style="text-align: right;">
            <div id="status-light" style="display:inline-block; width:10px; height:10px; background:var(--neon-blue); border-radius:50%; box-shadow: 0 0 10px var(--neon-blue);"></div>
            <span id="connection-status">CONNECTED</span>
        </div>
    </header>

    <div id="main-interface">
        <div id="deck-grid">
            <div style="grid-column: 1/-1; text-align: center; margin-top: 100px;">
                <div class="loader"></div>
                <p>INITIALIZING SATELLITE HANDSHAKE...</p>
            </div>
        </div>

        <div id="preview-panel">
            <div class="preview-header" id="p-title">NO SELECTION</div>
            <div style="margin-bottom: 10px; font-size: 0.8rem; color: #aaa;">APERÇU DU CONTENU (RAW):</div>
            <div id="code-block">// SELECT A DECK TO DECRYPT //</div>
            
            <a id="download-btn" href="#" target="_blank" style="text-decoration: none;">
                <button class="btn-action" style="width: 100%;">
                    ACQUIRE DATA
                </button>
            </a>
            <div style="margin-top: 10px; text-align: center; font-size: 0.7rem; color: #555;">
                SECURE CONNECTION VERIFIED via GITHUB API
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Change ces valeurs si tu déplaces le dossier
        const REPO_OWNER = 'ouaisfieu';
        const REPO_NAME = '1160';
        const REPO_PATH = 'job/job/job/store'; // Chemin vers le dossier store DANS le repo
        
        // --- VISUALS (Moving Grid) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * 2 + 0.5;
                this.size = Math.random() * 2;
            }
            update() {
                this.y += this.z;
                if (this.y > height) {
                    this.y = 0;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${0.5 / this.z})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.2)'; // Trail effect
            ctx.fillRect(0, 0, width, height);
            
            // Draw Grid Floor effect
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.beginPath();
            for(let i=0; i<width; i+=50) { ctx.moveTo(i, 0); ctx.lineTo(i, height); }
            for(let i=0; i<height; i+=50) { ctx.moveTo(0, i); ctx.lineTo(width, i); }
            ctx.stroke();

            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- GITHUB API LOGIC ---
        
        const grid = document.getElementById('deck-grid');
        const previewPanel = document.getElementById('preview-panel');
        const pTitle = document.getElementById('p-title');
        const codeBlock = document.getElementById('code-block');
        const downloadBtn = document.getElementById('download-btn');

        async function fetchStoreContent() {
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_PATH}`;
            console.log("Contacting: " + apiUrl);

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error(`HTTP ERROR: ${response.status}`);
                
                const data = await response.json();
                
                // Filter only CSV files
                const decks = data.filter(file => file.name.endsWith('.csv'));
                
                renderDecks(decks);

            } catch (error) {
                console.error(error);
                grid.innerHTML = `
                    <div style="color: #f00; grid-column: 1/-1; text-align: center; border: 1px solid #f00; padding: 20px;">
                        <h3>CONNECTION FAILURE</h3>
                        <p>${error.message}</p>
                        <p>Vérifie que le repo est PUBLIC et que le chemin '${REPO_PATH}' existe.</p>
                    </div>
                `;
                document.getElementById('connection-status').innerText = "OFFLINE";
                document.getElementById('connection-status').style.color = "red";
                document.getElementById('status-light').style.background = "red";
            }
        }

        function renderDecks(decks) {
            grid.innerHTML = ''; // Clear loader

            if (decks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center;">AUCUN FICHIER CSV DÉTECTÉ DANS LE SECTEUR.</div>';
                return;
            }

            decks.forEach((deck, index) => {
                // Staggered animation delay
                const card = document.createElement('div');
                card.className = 'deck-card';
                card.style.animation = `fadeIn 0.5s ease forwards ${index * 0.1}s`;
                card.innerHTML = `
                    <div class="deck-icon">💾</div>
                    <div class="deck-title">${deck.name.replace('.csv', '')}</div>
                    <div class="deck-meta">SIZE: ${Math.round(deck.size / 1024)} KB <br> SHA: ${deck.sha.substring(0,7)}</div>
                `;
                
                card.onclick = () => loadPreview(deck);
                grid.appendChild(card);
            });
        }

        async function loadPreview(deck) {
            // UI Feedback
            previewPanel.classList.add('active');
            pTitle.innerText = deck.name;
            codeBlock.innerText = "DECRYPTING STREAM...";
            downloadBtn.href = deck.download_url; // Direct link to raw file

            try {
                // Fetch the raw content for preview
                const res = await fetch(deck.download_url);
                const text = await res.text();
                
                // Show first 10 lines only to look cool
                const lines = text.split('\n').slice(0, 15).join('\n');
                codeBlock.innerText = lines + "\n\n// ... END OF PREVIEW ...";
            } catch (e) {
                codeBlock.innerText = "ERROR FETCHING PREVIEW DATA.";
            }
        }

        // Initialize
        fetchStoreContent();

    </script>
</body>
</html>
