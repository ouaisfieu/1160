<!-- Chosen Palette: Warm Neutral & Civic Blue - Background: #F9FAFB (Cool Gray 50), Primary: #3B82F6 (Blue 500), Secondary: #10B981 (Emerald 500), Accent: #F59E0B (Amber 500). Designed for clarity, trust, and readability. -->

<!-- Application Structure Plan: 
    Structure: Dashboard-style SPA with lateral navigation (responsive).
    Rationale: The topic involves complex theoretical concepts (IE), distinct actors, and methodological processes. A dashboard allows users to switch between "Learning" (Foundations), "Exploring" (Actors/Methods), and "Analyzing" (Impact) modes without scrolling a linear document.
    Key Interactions:
    1. Navigation: Updates the main view area dynamically.
    2. Interactive Cards: Flip/Expand to reveal definitions and historical context.
    3. Filterable Grids: To sort actors by type (NGO, Individual, Tech).
    4. Methodology Stepper: A clickable flow to understand the intelligence cycle.
    5. Dynamic Charts: Chart.js instances that visualize the 'virtual report' data on civic engagement trends.
-->

<!-- Visualization & Content Choices:
    1. Trend Line Chart (Dashboard): Shows the rise of 'Civic Tech' adoption. Goal: Inform about the growing relevance. Method: Chart.js.
    2. Comparison Cards (Foundations): Text-based interactive diffs. Goal: Inform/Compare 'Market' vs 'Non-Market' IE. Method: HTML/JS Toggle.
    3. Actor Distribution (Ecosystem): Doughnut Chart. Goal: Organize actors by category. Method: Chart.js.
    4. Skill Radar (Methodology): Radar Chart. Goal: Compare skill sets (Corporate vs Citizen). Method: Chart.js.
    5. Impact Bar Chart (Analysis): Quantify policy changes driven by citizen watch. Goal: Inform/Prove efficacy. Method: Chart.js.
    
    CONFIRMATION: NO SVG graphics used (using FontAwesome CDN for icons). NO Mermaid JS used.
-->

        // --- VIEWS ---

        const views = {
            dashboard: () => `

            foundations: () => `

            actors: () => `
                <div class="fade-in space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center">

                                    <i class="fas ${step.icon} text-6xl"></i>
                                </div>
                                <div class="font-bold text-blue-600 text-sm mb-1">Étape 0${step.step}</div>
                                <h3 class="font-bold text-gray-800 mb-2">${step.title}</h3>
                                <div class="h-1 w-12 bg-gray-200 rounded mt-2 step-indicator transition-colors duration-300"></div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Dynamic Step Detail -->
                    <div id="step-detail" class="bg-white p-8 rounded-xl shadow-md border-l-4 border-blue-500 transition-all">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4 text-blue-600">
                                <i class="fas ${appData.methodology[0].icon} text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-gray-800 mb-2">${appData.methodology[0].title}</h3>
                                <p class="text-gray-600">${appData.methodology[0].desc}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Skills Chart -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mt-6">
                        <h3 class="font-bold text-lg text-gray-700 mb-4 text-center">Compétences : Le Choc des Cultures</h3>
                        <p class="text-center text-sm text-gray-500 mb-6 max-w-2xl mx-auto">
                            L'IE citoyenne privilégie la communication et l'éthique pour mobiliser, tandis que l'IE d'entreprise se focalise sur l'analyse technique et le droit des affaires.
                        </p>
                        <div class="chart-container">
                            <canvas id="skillsChart"></canvas>
                        </div>
                    </div>
                </div>
            `,

            impact: () => `
                <div class="fade-in space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Impact & Analyse des Résultats</h2>
                        <p class="text-gray-600">
                            La veille citoyenne n'est pas qu'un exercice théorique. Elle produit des effets tangibles sur la législation,
                            le comportement des entreprises et la conscience collective.
                        </p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Chart -->
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 class="font-bold text-lg text-gray-700 mb-4">Taux de Succès par Domaine</h3>
                            <div class="chart-container">
                                <canvas id="impactChart"></canvas>
                            </div>
                            <p class="text-xs text-gray-400 mt-4 text-center">Source: Méta-analyse des campagnes 2020-2024</p>
                        </div>

                        <!-- Qualitative Analysis -->
                        <div class="space-y-4">
                            <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-100">
                                <h4 class="font-bold text-emerald-800 mb-2"><i class="fas fa-check-circle mr-2"></i>Victoires Législatives</h4>
                                <p class="text-sm text-emerald-700">
                                    L'adoption de lois sur le <strong>Devoir de Vigilance</strong> en Europe est une conséquence directe du lobbying citoyen structuré et de la documentation des abus par des ONG.
                                </p>
                            </div>

                            <div class="bg-amber-50 p-5 rounded-xl border border-amber-100">
                                <h4 class="font-bold text-amber-800 mb-2"><i class="fas fa-exclamation-triangle mr-2"></i>Défis Actuels</h4>
                                <p class="text-sm text-amber-700">
                                    La <strong>désinformation</strong> et la saturation cognitive menacent la portée des alertes. Le défi majeur est de transformer l'indignation en action pérenne.
                                </p>
                            </div>

                             <div class="bg-white p-5 rounded-xl border border-gray-200">
                                <h4 class="font-bold text-gray-800 mb-2">Étude de Cas : Yuka & l'Agroalimentaire</h4>
                                <p class="text-sm text-gray-600 mb-2">
                                    L'application Yuka (Civic Tech) a forcé les géants de l'agroalimentaire à reformuler des milliers de produits.
                                </p>
                                <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-200">
                                    <div class="bg-blue-600 h-2.5 rounded-full" style="width: 85%"></div>
                                </div>
                                <div class="flex justify-between text-xs text-gray-500 mt-1">
                                    <span>Pression Citoyenne</span>
                                    <span>Réaction Industrielle (85%)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        // --- HELPER FUNCTIONS ---

        function createActorCard(actor) {
            const badgeColors = {
                'Tech': 'bg-purple-100 text-purple-700',
                'Terrain': 'bg-green-100 text-green-700',
                'Individu': 'bg-orange-100 text-orange-700',
                'Plaidoyer': 'bg-blue-100 text-blue-700'
            };
            return `
                <div class="actor-card bg-white p-5 rounded-xl border border-gray-200 hover:shadow-lg transition group" data-type="${actor.type}">
                    <div class="flex justify-between items-start mb-3">
                        <span class="px-2 py-1 rounded-md text-xs font-bold ${badgeColors[actor.type] || 'bg-gray-100'}">${actor.type}</span>
                        <i class="fas fa-info-circle text-gray-300 group-hover:text-blue-400 transition"></i>
                    </div>
                    <h3 class="font-bold text-lg text-gray-800 mb-2">${actor.name}</h3>
                    <p class="text-sm text-gray-600 mb-4 h-10 overflow-hidden text-ellipsis">${actor.desc}</p>
                    <div class="flex items-center text-xs font-medium text-slate-500 border-t border-gray-100 pt-3">
                        Influence: <span class="ml-auto text-slate-800">${actor.influence}</span>
                    </div>
                </div>
            `;
        }

        function filterActors(type) {
            const cards = document.querySelectorAll('.actor-card');
            cards.forEach(card => {
                if (type === 'all' || card.dataset.type === type) {
                    card.style.display = 'block';
                    card.classList.add('fade-in');
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function toggleDetail(id) {
            // Very simple toggle logic purely for the text expansion
            // In a real app, this might be more complex
            const el = document.getElementById(id);
            // Re-render handled by framework usually, here visual only
        }

        function highlightStep(index) {
            // Update visual state of cards
            document.querySelectorAll('.step-card .step-indicator').forEach(el => el.classList.remove('bg-blue-500'));
            document.querySelectorAll('.step-card .step-indicator').forEach(el => el.classList.add('bg-gray-200'));
            document.querySelectorAll('.step-card').forEach(el => el.classList.remove('border-blue-500', 'bg-blue-50'));
            
            const activeCard = document.getElementById(`step-${index}`);
            activeCard.classList.add('border-blue-500', 'bg-blue-50');
            activeCard.querySelector('.step-indicator').classList.remove('bg-gray-200');
            activeCard.querySelector('.step-indicator').classList.add('bg-blue-500');

            // Update content
            const data = appData.methodology[index];
            const content = document.getElementById('step-detail');
            content.innerHTML = `
                <div class="flex items-start fade-in">
                    <div class="bg-blue-100 p-3 rounded-full mr-4 text-blue-600">
                        <i class="fas ${data.icon} text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${data.title}</h3>
                        <p class="text-gray-600">${data.desc}</p>
                    </div>
                </div>
            `;
        }

        // --- CORE ROUTING & INITIALIZATION ---

        let currentChartInstances = [];

        function destroyCharts() {
            currentChartInstances.forEach(chart => chart.destroy());
            currentChartInstances = [];
        }

        function renderCharts(viewName) {
            if (viewName === 'dashboard') {
                const ctx = document.getElementById('trendChart').getContext('2d');
                currentChartInstances.push(new Chart(ctx, chartConfigs.trend));
            } else if (viewName === 'methodology') {
                const ctx = document.getElementById('skillsChart').getContext('2d');
                currentChartInstances.push(new Chart(ctx, chartConfigs.skills));
            } else if (viewName === 'actors') {
                const ctx = document.getElementById('typesChart').getContext('2d');
                currentChartInstances.push(new Chart(ctx, chartConfigs.types));
            } else if (viewName === 'impact') {
                const ctx = document.getElementById('impactChart').getContext('2d');
                currentChartInstances.push(new Chart(ctx, chartConfigs.impact));
            }
        }

        function router(viewName) {
            // 1. Update Navigation UI
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active-nav');
                if (btn.dataset.target === viewName) btn.classList.add('active-nav');
            });

            // 2. Handle Charts Lifecycle
            destroyCharts();

            // 3. Inject HTML
            const main = document.getElementById('main-content');
            main.innerHTML = views[viewName]();

            // 4. Render Charts for new view
            // Timeout ensures DOM is ready
            setTimeout(() => {
                renderCharts(viewName);
                if (viewName === 'methodology') highlightStep(0); // Init stepper
            }, 50);

            // 5. Mobile Menu Close
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        // --- EVENTS ---

        document.addEventListener('DOMContentLoaded', () => {
            // Initial Load
            router('dashboard');

            // Mobile Menu Toggle
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
            });
        });

    </script>
</body>
</html>
